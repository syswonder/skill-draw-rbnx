manifestVersion: 1

package:
  name: robonix.skill.draw
  version: 0.1.0
  description: XYZ 三轴写字机绘图技能 — 声明式场景直绘、提示词生图、debug 预览、指定目录读图与多模式轮廓绘制。
  tags: [skill, plot, draw, image, imagegen, preview, scene, skeleton, xyz]
  maintainers:
    - shadosider <1439107161@qq.com>
    - MuoTT <muott0927@gmail.com>
  license: MIT

build: bash scripts/build.sh
start: bash scripts/start.sh

# Package-local contracts: this skill owns preview/draw/list.
# Text writing moved to skill-write_text-rbnx (robonix/skill/text/*).
# The primitive contracts mirrored under capabilities/primitive/ are
# consumed but NOT listed here — they exist only so rbnx codegen emits
# the gRPC stubs this skill calls.
capabilities:
  - name: robonix/skill/plot/driver
    path: capabilities/driver.v1.toml
    transport: grpc
  - name: robonix/skill/plot/config
    path: capabilities/config.v1.toml
    transport: mcp
  - name: robonix/skill/plot/render_preview
    path: capabilities/render_preview.v1.toml
    transport: mcp
  - name: robonix/skill/plot/draw_scene
    path: capabilities/draw_scene.v1.toml
    transport: mcp
  - name: robonix/skill/plot/draw_prompt
    path: capabilities/draw_prompt.v1.toml
    transport: mcp
  - name: robonix/skill/plot/draw_image
    path: capabilities/draw_image.v1.toml
    transport: mcp
  - name: robonix/skill/plot/list_images
    path: capabilities/list_images.v1.toml
    transport: mcp

depends: []